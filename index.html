<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>
/* iPhone·iPad Safari: 입력창을 누를 때 화면이 자동으로 확대되지 않게 (두 손가락 확대는 계속 됨) */
(function(){var u=navigator.userAgent||"";if(!(/iP(hone|od|ad)/.test(u)||(/Macintosh/.test(u)&&navigator.maxTouchPoints>1)))return;
var m=document.querySelector('meta[name="viewport"]');if(m&&!/maximum-scale/.test(m.content))m.content+=", maximum-scale=1";})();
</script>
<script>
/* 안드로이드 앱(KilrelaghPostApp) 안에서 열렸을 때 표시 — 앱 전용 크기 조정에 씀 */
if (/KilrelaghPostApp/.test(navigator.userAgent || "")) document.documentElement.classList.add("in-app");
</script>
<meta name="robots" content="noindex, nofollow">
<title>킬렐러 우체국</title>
<meta name="description" content="페이건 오멘 스쿨 세계관 참여자 전용 공간">
<meta name="theme-color" content="#141414">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="킬렐러 우체국">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Playfair+Display:ital,wght@0,900;1,400&family=Old+Standard+TT:wght@700&family=Noto+Sans+KR:wght@400;700&family=Noto+Serif+KR:wght@400;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="mast">
  <div class="mast-row">
    <div class="mast-ear">Members'<br>Edition</div>
    <h1>The Kilrelagh Post</h1>
    <div class="mast-ear right">Fermanagh<br>Est. 1605</div>
  </div>
  <div class="mast-sub" id="mast-sub"><span class="ms-a">킬렐러 우체국 · 회원 전용</span><span id="today"></span><span class="ms-c">No Fishing Beyond This Line</span></div>
  <nav class="nav" id="nav" hidden>
    <a href="#/chat/square" data-sec="chat">광장</a>
    <a href="#/board" data-sec="board">게시판</a>
    <a href="#/mail" data-sec="mail">쪽지함 <span class="badge" id="mail-badge" hidden>0</span></a>
    <a href="#/rooms" data-sec="rooms">둘만의 방 <span class="badge" id="room-badge" hidden>0</span></a>
    <a href="#/people" data-sec="people">인물록</a>
    <a href="#/settings" data-sec="settings">설정</a>
    <span class="nav-spacer"></span>
    <div class="whoami">
      <label for="active-char" class="muted" style="font-size:.8rem">말하는 인물</label>
      <select id="active-char"></select>
      <button type="button" class="linkbtn" id="logout">로그아웃</button>
    </div>
  </nav>
</header>
<main id="app"><p class="loading">편지를 분류하는 중…</p></main>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<div class="bgm" id="bgm-box" data-open="false" hidden>
  <button type="button" class="bgm-fold" id="bgm-fold" aria-expanded="false" aria-controls="bgm-panel" aria-label="음악 막대 펼치기">
    <span class="bgm-bars" aria-hidden="true"><i></i><i></i><i></i></span><span class="bgm-close" aria-hidden="true">›</span>
  </button>
  <div class="bgm-panel" id="bgm-panel">
    <button type="button" class="bgm-toggle" id="bgm-toggle" aria-pressed="false" aria-label="배경음악 켜기/끄기"><span class="bgm-label">Music Off</span></button>
    <label class="bgm-vol" for="bgm-volume"><span class="sr-only">배경음악 소리 크기</span><input type="range" id="bgm-volume" min="0" max="100" step="5" value="40"></label>
  </div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
